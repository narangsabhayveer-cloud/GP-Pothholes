<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Hole Lot Cleaner - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">A Hole Lot Cleaner</div>
  <a href="index.html">Back to report page</a>
</header>

<section class="hero">
  <h1>Admin dashboard</h1>
  <p>Review reports, update their progress and add after-repair photos.</p>
</section>

<main class="wide">

  <!-- Login box (shown first) -->
  <section class="card login" id="login">
    <h2>Admin sign in</h2>
    <form id="loginForm">
      <label for="password">Admin passcode</label>
      <input id="password" type="password" required>
      <button class="full" type="submit">Sign in</button>
      <div id="loginError" class="message error" hidden></div>
    </form>
  </section>

  <!-- Dashboard (shown after login) -->
  <section id="dashboard" hidden>

    <div class="stats">
      <div class="card"><strong id="total">0</strong>Total reports</div>
      <div class="card"><strong id="active">0</strong>Not fixed yet</div>
      <div class="card"><strong id="fixed">0</strong>Fixed</div>
    </div>

    <div class="toolbar">
      <h2>All requests</h2>
      <div>
        <button type="button" id="refreshBtn">Refresh</button>
        <select id="filter"></select>
      </div>
    </div>

    <div id="reports"></div>
  </section>

</main>

<script src="common.js"></script>
<script>
const STATUSES = ["Reported", "Under review", "Team assigned", "Repaired"];

let password = "";  // remembered after login, sent with every request
let reports = [];   // the list of reports from the server

const $ = (id) => document.getElementById(id);

// Make the filter dropdown: "All statuses" + one option per status
$("filter").innerHTML =
  '<option value="all">All statuses</option>' +
  STATUSES.map((s) => `<option>${s}</option>`).join("");

// Stops report text from being treated as HTML (important for safety!)
function esc(text) {
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML.replace(/"/g, "&quot;");
}

// Talk to the server. Always sends the admin password.
async function api(url, method, body) {
  const response = await fetch(url, {
    method: method || "GET",
    headers: { "Content-Type": "application/json", "x-admin-pass": password },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Request failed");
  return data;
}

/* ---------------- Login ---------------- */
$("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const entered = $("password").value;

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: entered }),
    });
    if (!response.ok) throw new Error("Incorrect passcode. Try again.");

    password = entered;
    $("login").hidden = true;
    $("dashboard").hidden = false;
    loadReports();
  } catch (error) {
    $("loginError").textContent = error.message;
    $("loginError").hidden = false;
  }
});

/* ---------------- Loading and showing reports ---------------- */
async function loadReports() {
  try {
    reports = await api("/api/reports");
    showReports();
  } catch (error) {
    alert("Could not load reports: " + error.message);
  }
}

function showReports() {
  // Update the three numbers at the top
  $("total").textContent = reports.length;
  $("fixed").textContent = reports.filter((r) => r.status === "Repaired").length;
  $("active").textContent = reports.length - $("fixed").textContent;

  // Only show reports that match the filter
  const filter = $("filter").value;
  const shown = reports.filter((r) => filter === "all" || r.status === filter);

  $("reports").innerHTML = shown.length
    ? shown.map(reportCard).join("")
    : '<div class="card center muted">No reports found yet.</div>';
}

// Builds the HTML for one report
function reportCard(r) {
  const options = STATUSES.map(
    (s) => `<option ${s === r.status ? "selected" : ""}>${s}</option>`
  ).join("");

  const afterPhoto = r.after
    ? `<img src="${esc(r.after)}" alt="After repair">`
    : '<div class="no-photo">No after photo yet</div>';

  return `
    <article class="card">
      <h3>${esc(r.location)}</h3>
      <div class="muted">
        ${esc(r.area || "Area not specified")} · ${new Date(r.created).toLocaleString()}<br>
        Severity: <b>${esc(r.severity)}</b><br>
        Phone: <b>${esc(r.phone)}</b><br>
        ${esc(r.details || "No extra details")}
      </div>
      <p><span class="chip">${esc(r.status)}</span></p>

      <div class="two-columns">
        <div><b>BEFORE</b><br><img src="${esc(r.before)}" alt="Before repair"></div>
        <div><b>AFTER</b><br>${afterPhoto}</div>
      </div>

      <div class="two-columns">
        <div>
          <label>Update status</label>
          <select onchange="changeStatus(${r.id}, this.value)">${options}</select>
        </div>
        <div>
          <label>Upload after-repair photo</label>
          <input type="file" accept="image/*" onchange="uploadAfterPhoto(${r.id}, this)">
        </div>
      </div>

      <p style="text-align:right">
        <button type="button" onclick="deleteReport(${r.id})">Delete request</button>
      </p>
    </article>`;
}

/* ---------------- Admin actions ---------------- */
async function changeStatus(id, status) {
  try {
    await api("/api/reports/" + id, "PATCH", { status });
    loadReports();
  } catch (error) {
    alert("Could not save: " + error.message);
  }
}

async function uploadAfterPhoto(id, input) {
  if (!input.files[0]) return;
  try {
    const after = await resizePhoto(input.files[0]);
    await api("/api/reports/" + id, "PATCH", { after });
    loadReports();
  } catch (error) {
    alert("Could not save: " + error.message);
  }
}

async function deleteReport(id) {
  if (!confirm("Delete this report? This cannot be undone.")) return;
  try {
    await api("/api/reports/" + id, "DELETE");
    loadReports();
  } catch (error) {
    alert("Could not delete: " + error.message);
  }
}

$("filter").addEventListener("change", showReports);
$("refreshBtn").addEventListener("click", loadReports);
</script>

</body>
</html>
